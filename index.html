<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RMPG Flex — Coming Soon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .container {
      max-width: 600px;
      text-align: center;
    }
    .logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #1e40af, #3b82f6);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 2rem;
      font-size: 2rem;
      font-weight: 800;
      color: #fff;
      box-shadow: 0 8px 32px rgba(59, 130, 246, 0.3);
    }
    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    p {
      font-size: 1.125rem;
      line-height: 1.7;
      color: #94a3b8;
      margin-bottom: 2.5rem;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-radius: 999px;
      color: #4ade80;
      font-size: 0.875rem;
      margin-bottom: 3rem;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .badge {
      display: inline-block;
      padding: 0.375rem 0.75rem;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.25);
      border-radius: 6px;
      font-size: 0.75rem;
      color: #60a5fa;
      margin-bottom: 1.5rem;
    }
    .footer {
      font-size: 0.75rem;
      color: #475569;
    }
    @media (max-width: 480px) {
      h1 { font-size: 1.75rem; }
      p { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">RF</div>
    <h1>RMPG Flex</h1>
    <div class="badge">Cloudflare Workers / D1</div>
    <p>
      Public safety CAD &amp; RMS platform for Rocky Mountain Protective Group.
      We're migrating to a new infrastructure stack — the new system is being deployed
      and will be available soon.
    </p>
    <div class="status">
      <span class="status-dot"></span>
      System Status: Deploying
    </div>
    <div class="footer">
      &copy; <script>document.write(new Date().getFullYear())</script> Rocky Mountain Protective Group, LLC
    </div>
  </div>
</body>
</html>
